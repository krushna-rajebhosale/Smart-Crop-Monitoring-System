<nav class="topbar" aria-label="Main">
  <a class="brand" href="{{ url_for('index') }}">
    <span class="brand-mark"><i class="fa-solid fa-leaf"></i></span>
    <span>Smart Crop Monitoring</span>
  </a>
  <div class="nav-links">
    <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Analyse</a>

      <span class="status status-ok">Model ready</span>

      <span class="status status-warn" title="{{ model_error }}">Model not loaded</span>
    {% endif %}
  </div>
</nav>
