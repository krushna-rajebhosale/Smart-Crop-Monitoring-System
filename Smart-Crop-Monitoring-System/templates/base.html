<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upload a plant leaf photo to detect crop disease with a MobileNetV2 model and see crop-care guidance.">
  <title>{% block title %}Smart Crop Monitoring System{% endblock %}</title>

  <!-- Fonts & icons (need internet; the page still works without them) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% block hero %}
  <header class="site-header">
    <div class="container">
      {% include "_nav.html" %}
    </div>
  </header>
  {% endblock %}

  <main id="main" class="layout {% block layout_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer>
    Student Community Engagement Project &bull; Smart Agriculture AI Platform
    <span class="footer-note">Results are decision support only &mdash; always confirm with an agricultural expert.</span>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
